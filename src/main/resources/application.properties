spring.application.name=budget-system

# MySQL Database Configuration
# Cycle 23: DB接続情報は環境変数を必須とする（実値をこのファイルへ書かない）。
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# 危険な既定値へフォールバックさせないため、未設定時は起動に失敗させる。
# Dockerでの起動は compose.yaml が、通常のローカル起動は各自の環境変数が値を与える。
# 手順は DOCKER_QUICKSTART.md を参照。
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# App Version
app.version=v2.7.0

# Initialize database schema using schema.sql
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
# Cycle 23: schema初期化の失敗を成功扱いしない（途中失敗を見逃さない）
spring.sql.init.continue-on-error=false

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.miyazaki.icehockey.budgetsystem.model

# Thymeleaf cache
spring.thymeleaf.cache=false

# Logging
logging.level.com.miyazaki.icehockey.budgetsystem=DEBUG
